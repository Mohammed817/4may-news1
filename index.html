<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صحيفة 4 مايو - الأخبار المتزامنة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            color: #333;
        }
        header {
            background-color: #b71c1c;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            max-width: 950px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .news-section {
            background: #ffffff;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 15px;
            margin-top: 20px;
            border-top: 4px solid #b71c1c;
        }
        .news-section h2 {
            font-size: 1.2rem;
            color: #b71c1c;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-top: 0;
        }
        /* تصميم الإطار المتزامن لجلب أحدث أخبار الموقع الأصلي لحظياً */
        .live-frame-container {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
            background: #fff;
            margin-top: 10px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>موقع 4 مايو الإخباري</h1>
    </header>

    <div class="container">
        <div class="news-section">
            <h2>أحدث الأخبار المتزامنة من المصدر الأصلي لحظياً</h2>
            <div class="live-frame-container">
                <!-- إطار ذكي يعكس أحدث محتوى الموقع الأصلي ويتحدث بتجره تلقائية مع كل زيارة أو تحديث -->
                <iframe src="https://www.4may.net/" title="الأخبار المتزامنة"></iframe>
            </div>
        </div>
    </div>

</body>
</html>
