<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صحيفة 4 مايو - الأخبار المتزامنة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            color: #333;
        }
        header {
            background-color: #b71c1c;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            max-width: 950px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .news-section {
            background: #ffffff;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 15px;
            margin-top: 20px;
            border-top: 4px solid #b71c1c;
        }
        .news-section h2 {
            font-size: 1.2rem;
            color: #b71c1c;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-top: 0;
        }
        .live-frame-container {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
            background: #fff;
            margin-top: 10px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* تنسيقات قائمة الأخبار السفلية المتزامنة */
        .sync-news-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sync-news-item {
            background: #f2f2f2;
            border-bottom: 4px solid #fff;
            padding: 14px;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .sync-news-item:hover {
            background: #e9e9e9;
        }
        .sync-news-item a {
            color: #111;
            font-size: 17px;
            line-height: 1.9;
            font-weight: 400;
            text-decoration: none;
            display: block;
        }
        .loading-text {
            text-align: center;
            color: #777;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>موقع 4 مايو الإخباري</h1>
    </header>

    <div class="container">
        <div class="news-section">
            <h2>أحدث الأخبار المتزامنة من المصدر الأصلي لحظياً</h2>
            <div class="live-frame-container">
                <!-- الإطار العلوي الذي يعرض الموقع كاملاً -->
                <iframe src="https://www.4may.net/" title="الأخبار المتزامنة"></iframe>
            </div>
        </div>

        <!-- قسم الأخبار السفلية الذي سيتحدث تلقائياً -->
        <div class="news-section" style="border-top: 4px solid #c41e3a;">
            <div style="background-color: #c41e3a; color: white; padding: 10px; text-align: center; font-weight: bold; font-size: 16px; margin-bottom: 10px;">
                اهم الاخبار - صحيفة 4 مايو الالكترونية
            </div>
            <ul id="sync-news-container" class="sync-news-list">
                <li class="loading-text">جاري جلب أحدث الأخبار وتزامنها...</li>
            </ul>
        </div>
    </div>

    <script>
        async function fetchSynchronizedNews() {
            const container = document.getElementById('sync-news-container');
            
            try {
                // طلب البيانات من الـ API الخاص بنا
                const response = await fetch('/api/news');
                const result = await response.json();

                if (result.success && result.items && result.items.length > 0) {
                    container.innerHTML = ''; // مسح كلمة "جاري التحميل"

                    // بناء القائمة الجديدة بناءً على الأخبار المسحوبة
                    result.items.forEach(item => {
                        const li = document.createElement('li');
                        li.className = 'sync-news-item';

                        const a = document.createElement('a');
                        a.href = item.url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.textContent = item.title;

                        li.appendChild(a);
                        container.appendChild(li);
                    });
                } else {
                    container.innerHTML = '<li class="loading-text">لا توجد أخبار جديدة حالياً.</li>';
                }
            } catch (error) {
                console.error('خطأ في جلب الأخبار:', error);
                // في حال حدوث خطأ، نترك الأخبار القديمة إن وجدت أو نعرض رسالة
                if (container.children.length === 1 && container.children[0].classList.contains('loading-text')) {
                    container.innerHTML = '<li class="loading-text">تعذر التزامن مع المصدر حالياً.</li>';
                }
            }
        }

        // تشغيل الجلب فور فتح الصفحة
        fetchSynchronizedNews();

        // إعادة التزامن تلقائياً كل 5 دقائق (300000 ملي ثانية)
        setInterval(fetchSynchronizedNews, 300000);
    </script>

</body>
</html>
