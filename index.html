<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صحيفة 4 مايو - الأخبار المتزامنة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            color: #333;
        }
        header {
            background-color: #b71c1c;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .news-section {
            background: #ffffff;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 15px;
            margin-top: 20px;
            border-top: 4px solid #b71c1c;
        }
        .news-section h2 {
            font-size: 1.2rem;
            color: #b71c1c;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-top: 0;
        }
        #news-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #news-list li {
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        #news-list li a {
            color: #2c3e50;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
        }
        #news-list li a:hover {
            color: #b71c1c;
        }
        .loading {
            text-align: center;
            color: #666;
            padding: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>موقع 4 مايو الإخباري</h1>
    </header>

    <div class="container">
        <div class="news-section">
            <h2>أحدث الأخبار المتزامنة لحظياً</h2>
            <ul id="news-list">
                <li class="loading">جاري مزامنة وجلب الأخبار من المصدر...</li>
            </ul>
        </div>
    </div>

    <script>
        async function loadLiveNews() {
            const newsList = document.getElementById('news-list');
            try {
                // استخدام خدمة بديلة ومستقرة لتحويل الموقع إلى بيانات يمكن قراءتها
                const response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://www.4may.net/')}`);
                const htmlText = await response.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                // البحث عن الروابط والعناوين داخل الموقع الأصلي بدقة أكبر
                const anchors = doc.querySelectorAll('a');
                let items = [];
                
                anchors.forEach(a => {
                    let text = a.textContent.trim();
                    let href = a.getAttribute('href');
                    
                    // تصفية العناوين الحقيقية للأخبار (تجنب القوائم القصيرة والروابط الفارغة)
                    if (text.length > 20 && href && !items.some(i => i.title === text)) {
                        if (!href.startsWith('http')) {
                            href = `https://www.4may.net${href.startsWith('/') ? '' : '/'}${href}`;
                        }
                        items.push({ title: text, url: href });
                    }
                });

                if (items.length > 0) {
                    newsList.innerHTML = '';
                    // عرض أحدث 12 خبر فقط لتكون متناسقة
                    items.slice(0, 12).forEach(news => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href = news.url;
                        a.textContent = news.title;
                        a.target = '_blank';
                        li.appendChild(a);
                        newsList.appendChild(li);
                    });
                } else {
                    newsList.innerHTML = '<li class="loading">تعذر استخراج العناوين، جاري إعادة المحاولة...</li>';
                }
            } catch (err) {
                console.error(err);
                newsList.innerHTML = '<li class="loading">خطأ في الاتصال بالمصدر.</li>';
            }
        }

        loadLiveNews();
        // تحديث تلقائي كل 30 ثانية لتكون متزامنة تماماً
        setInterval(loadLiveNews, 30000);
    </script>
</body>
</html>
